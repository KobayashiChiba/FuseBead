<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>登录 - 拼豆图片识别工具</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body">

<div class="toast" id="toast"></div>

<div class="login-wrap">
    <div class="login-card">
        <div class="login-icon">🧩</div>
        <h1 class="login-title">拼豆识别</h1>
        <p class="login-subtitle">请输入密码以继续</p>

        <form id="loginForm" onsubmit="return handleLogin()">
            <div class="form-group">
                <input
                    class="form-input login-input"
                    type="password"
                    id="passwordInput"
                    placeholder="请输入密码"
                    autocomplete="off"
                >
            </div>
            <p class="login-error" id="loginError"></p>
            <button class="btn btn-primary login-btn" type="submit">登 录</button>
        </form>
    </div>
</div>

<script src="{{ url_for('static', filename='js/common.js') }}"></script>
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
<script>
(function() {
    // 已登录则直接跳转首页
    if (isLoggedIn()) {
        window.location.href = '/';
        return;
    }

    var errorEl = document.getElementById('loginError');

    window.handleLogin = function() {
        var pwd = document.getElementById('passwordInput').value.trim();
        if (!pwd) {
            errorEl.textContent = '请输入密码';
            return false;
        }
        if (doLogin(pwd)) {
            window.location.href = '/';
        } else {
            errorEl.textContent = '密码错误，请重试';
            document.getElementById('passwordInput').value = '';
            document.getElementById('passwordInput').focus();
        }
        return false;
    };
})();
</script>

</body>
</html>
