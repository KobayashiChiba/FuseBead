<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>拼豆图片识别工具</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="toast" id="toast"></div>

<header class="header">
    <div class="header-inner">
        <h1>🧩 拼豆识别</h1>
        <span class="subtitle">图片 → 拼豆图纸</span>
        <div class="header-right">
            <button class="btn btn-outline btn-sm" onclick="doLogout()" title="退出登录">退出</button>
        </div>
    </div>
</header>

<div class="container">
    <div class="step-card active">
        <h2>选择功能</h2>
        <p class="step-desc">请选择您需要的功能</p>

        <div class="index-cards">
            <a href="/recognize" class="func-card">
                <span class="card-icon">🧩</span>
                <div class="card-title">拼豆识别</div>
                <div class="card-desc">上传拼豆图片，自动识别网格中的每个色块，生成拼豆图纸</div>
            </a>
            <a href="/convert" class="func-card">
                <span class="card-icon">🖼️</span>
                <div class="card-title">图片转换</div>
                <div class="card-desc">将普通图片自动转换为拼豆图纸</div>
            </a>
            <a href="/projects" class="func-card">
                <span class="card-icon">📂</span>
                <div class="card-title">加载项目</div>
                <div class="card-desc">打开之前已保存的拼豆项目，继续查看或编辑</div>
            </a>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/common.js') }}"></script>
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
<script>
requireAuth();
console.log('FuseBead 功能选择页已加载');
</script>
</body>
</html>
